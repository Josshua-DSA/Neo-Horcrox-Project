version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: neo_horcrox_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neo_horcrox
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neo_horcrox"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neo_horcrox_api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Neo Horcrox Supply Chain API
      DEBUG: "false"
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/neo_horcrox
      ALLOWED_ORIGINS: "*"
    volumes:
      - ./model/artifacts:/project/model/artifacts:ro
      - ./model/dataset:/project/model/dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: neo_horcrox_frontend
    working_dir: /frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    volumes:
      - ./app/frontend:/frontend
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
