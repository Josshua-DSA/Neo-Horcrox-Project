version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: neo_horcrox_postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neo_horcrox
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d neo_horcrox"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: neo_horcrox_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/app/backend/artifacts:ro
    environment:
      - DEBUG=false
      - ARTIFACTS_DIR=backend/artifacts
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/neo_horcrox
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: